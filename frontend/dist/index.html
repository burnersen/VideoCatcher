<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VideoCatcher</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>VideoCatcher</h1>
    <p class="lead">Choose a file to see its size and SHA-256 checksum.</p>

    <button id="pick" type="button">Choose a file</button>
    <span id="status" class="status" aria-live="polite"></span>

    <section id="error" class="box error" role="alert" hidden>
      <p id="error-msg" class="msg"></p>
      <p id="error-hint" class="hint"></p>
    </section>

    <section id="result" class="box" hidden>
      <p><span class="label">File</span> <span id="result-path"></span></p>
      <p><span class="label">Size</span> <span id="result-size"></span></p>
      <p><span class="label">SHA-256</span> <code id="result-sha"></code></p>
    </section>
  </main>
  <footer>VideoCatcher <span id="version"></span></footer>
  <script src="app.js"></script>
</body>
</html>
