#
# Live test with the real programs on Windows (dev-starterkit 06 T5): the
# newest yt-dlp through the real signature check, the pinned FFmpeg and
# Deno, and one real download. By hand, once a week (yt-dlp and the sites
# change without VideoCatcher changing), and on every push that changes the
# parts that fetch the programs or talk to yt-dlp.
name: Live test

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Link to test with (empty: yt-dlp test video)'
        required: false
  schedule:
    - cron: '17 4 * * 1'
  push:
    paths:
      - 'ytdlp.go'
      - 'pgp.go'
      - 'tools.go'
      - 'toolbox.go'
      - 'download.go'
      - 'runtime.json'
      - 'options.go'
      - 'progress.go'
      - 'proc*.go'
      - 'queue.go'
      - 'live_test.go'
      - '.github/workflows/live.yml'

permissions:
  contents: read

jobs:
  live:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: live test
        env:
          VIDEOCATCHER_TEST_LIVE: '1'
          VIDEOCATCHER_TEST_URL: ${{ inputs.url }}
        run: go test -count=1 -run Live -v -timeout 30m ./...
